<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffc9df">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小小生活">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>🎀 Hello Kitty · 我的小小生活工作台</title>
<style>
:root{
  --pink:#ffb6d5; --pink-deep:#ff7eb6; --pink-soft:#fff0f6;
  --bg1:#fff5fa; --bg2:#ffeaf4;
  --ink:#5b3a52; --ink-soft:#8a6a80; --ink-faint:#b79aac;
  --card:rgba(255,255,255,.72);
  --line:#ffc9df;
  --lavender:#cdb4f6; --mint:#b8f0d8; --lemon:#fff3b0; --peach:#ffd9c0; --sky:#bde3ff;
  --shadow:0 6px 18px rgba(255,126,182,.18);
  --r:24px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Yuanti SC",system-ui,sans-serif;
  color:var(--ink); background:var(--bg1);
  min-height:100vh; overflow-x:hidden;
  -webkit-font-smoothing:antialiased; user-select:none;
}
button{font-family:inherit; border:none; background:none; cursor:pointer; color:inherit;}
input,textarea,select{font-family:inherit; color:var(--ink);}
/* ---------- 固定背景：卡通场景，不随内容滚动 ---------- */
#bg{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  background:
    radial-gradient(120% 90% at 15% -10%, #fff9fb 0%, rgba(255,249,251,0) 55%),
    radial-gradient(120% 100% at 90% 0%, #ffeef6 0%, rgba(255,238,246,0) 60%),
    linear-gradient(180deg, var(--bg2) 0%, #fff2f9 45%, #fff7ee 100%);
}
#bg .deco{position:absolute; opacity:.85;}
.cloud{background:#fff; border-radius:999px; box-shadow:0 8px 22px rgba(255,158,201,.18);}
.cloud::before,.cloud::after{content:""; position:absolute; background:#fff; border-radius:50%;}
.cloud::before{width:60%; height:150%; left:12%; top:-70%;}
.cloud::after{width:40%; height:100%; left:45%; top:-45%;}
#grass{position:absolute; left:0; right:0; bottom:0; height:90px;}
.gwave{position:absolute; bottom:0; left:-5%; width:110%; height:100%;}
#page{position:relative; z-index:1; padding-bottom:118px; max-width:620px; margin:0 auto;}
/* ---------- 顶部栏 ---------- */
#topbar{position:sticky; top:0; z-index:30; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  background:rgba(255,240,246,.82); border-bottom:2px solid rgba(255,201,223,.7);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px; display:flex; align-items:center; justify-content:space-between;}
#topbar .brand{display:flex; align-items:center; gap:8px; font-size:17px; font-weight:700; color:var(--pink-deep);}
#topbar .brand .bow{font-size:20px;}
#topbar .clock{font-size:12px; color:var(--ink-soft); text-align:right; line-height:1.35;}
#topbar .clock b{display:block; font-size:15px; color:var(--ink);}
/* ---------- 插画卡 Hero ---------- */
.hero{position:relative; margin:14px 12px 10px; padding:14px 16px; border-radius:26px 20px 28px 22px / 22px 26px 20px 28px;
  background:linear-gradient(135deg, rgba(255,255,255,.9), rgba(255,230,242,.9));
  border:2px solid var(--line); box-shadow:var(--shadow); display:flex; align-items:center; gap:12px; overflow:hidden;}
.hero .kitty{width:76px; height:76px; flex:0 0 76px; filter:drop-shadow(0 4px 8px rgba(255,126,182,.25));}
.hero .txt{flex:1; min-width:0;}
.hero .txt .hi{font-size:16px; font-weight:700; color:var(--pink-deep); margin-bottom:3px;}
.hero .txt .sub{font-size:12px; color:var(--ink-soft); line-height:1.5;}
.hero .sticker{position:absolute; top:8px; right:12px; font-size:22px; transform:rotate(12deg);}
/* ---------- 卡片 ---------- */
.card{position:relative; margin:10px 12px; padding:14px 14px 16px; border-radius:22px 26px 20px 30px / 26px 20px 30px 22px;
  background:var(--card); border:2px solid rgba(255,201,223,.85); box-shadow:var(--shadow);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);}
.card::before{content:""; position:absolute; left:-7px; top:18px; width:14px; height:14px; background:#fff; border:2px solid var(--line); border-radius:50%; box-shadow:0 0 0 3px rgba(255,182,213,.25);}
.card h2.ctitle{display:flex; align-items:center; gap:8px; margin:0 0 10px; font-size:16px; font-weight:700; color:var(--pink-deep);}
.card h2.ctitle .ico{font-size:20px;}
.card .hint{font-size:11px; color:var(--ink-faint); line-height:1.5;}
/* ---------- 云朵按钮 ---------- */
.btn{position:relative; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:11px 20px 11px 22px; border-radius:999px; font-size:15px; font-weight:700; color:#fff;
  background:linear-gradient(180deg,#ff9ecb,#ff7eb6); box-shadow:0 5px 0 #e76aa2, 0 9px 16px rgba(255,126,182,.35);
  transition:transform .06s ease, box-shadow .06s ease;}
.btn::before{content:""; position:absolute; left:-4px; top:-7px; width:22px; height:22px; border-radius:50%; background:inherit;}
.btn::after{content:""; position:absolute; right:-3px; top:-5px; width:18px; height:18px; border-radius:50%; background:inherit;}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 #e76aa2, 0 3px 8px rgba(255,126,182,.3);}
.btn.ghost{background:linear-gradient(180deg,#fff,#ffeef6); color:var(--pink-deep); border:2px solid var(--line); box-shadow:0 4px 0 #f3bcd6, 0 7px 12px rgba(255,126,182,.18);}
.btn.ghost:active{transform:translateY(3px); box-shadow:0 1px 0 #f3bcd6;}
.btn.mini{padding:7px 14px 7px 15px; font-size:12px; box-shadow:0 3px 0 #e76aa2, 0 5px 10px rgba(255,126,182,.3);}
.btn.mini::before{width:16px;height:16px;left:-3px;top:-5px;}
.btn.mini::after{width:13px;height:13px;right:-2px;top:-4px;}
.btn.mini:active{transform:translateY(2px); box-shadow:0 1px 0 #e76aa2;}
.btn.danger{background:linear-gradient(180deg,#ffb3b3,#ff8a8a); box-shadow:0 5px 0 #e06f6f,0 9px 16px rgba(255,120,120,.3);}
.btn.danger:active{box-shadow:0 1px 0 #e06f6f;}
.btn.block{display:flex; width:100%;}
.btn:disabled{opacity:.5; pointer-events:none;}
/* ---------- 输入框手绘边框 ---------- */
.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; font-weight:700;}
.inp,textarea.inp,select.inp{width:100%; padding:11px 14px; font-size:14px; background:rgba(255,255,255,.9);
  border:2px solid var(--line); border-radius:14px 18px 14px 20px / 18px 14px 20px 14px; outline:none; box-shadow:inset 0 2px 5px rgba(255,182,213,.2);}
.inp:focus{border-color:var(--pink-deep); box-shadow:0 0 0 3px rgba(255,126,182,.15), inset 0 2px 5px rgba(255,182,213,.2);}
textarea.inp{min-height:88px; resize:vertical; line-height:1.6;}
select.inp{appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--pink-deep) 50%),linear-gradient(135deg,var(--pink-deep) 50%,transparent 50%); background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%; background-size:6px 6px; background-repeat:no-repeat;}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.row .grow{flex:1; min-width:0;}
/* ---------- 底部导航 ---------- */
#bottomNav{position:fixed; left:0; right:0; bottom:0; z-index:40; background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-top:2px solid var(--line);
  padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px); overflow-x:auto; white-space:nowrap;
  display:flex; gap:2px; scrollbar-width:none;}
#bottomNav::-webkit-scrollbar{display:none;}
#bottomNav .nav{flex:0 0 auto; display:inline-flex; flex-direction:column; align-items:center; gap:2px;
  padding:7px 10px; border-radius:16px; font-size:11px; color:var(--ink-soft); min-width:58px; transition:.15s;}
#bottomNav .nav .ni{font-size:21px; line-height:1;}
#bottomNav .nav.on{color:var(--pink-deep); background:var(--pink-soft); box-shadow:inset 0 0 0 2px var(--line); font-weight:700;}
/* ---------- 页面 ---------- */
.page{display:none; animation:fade .25s ease;}
.page.on{display:block;}
@keyframes fade{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
/* ---------- 顶部横幅 ---------- */
#banner{position:fixed; top:calc(env(safe-area-inset-top,0px) + 8px); left:12px; right:12px; z-index:60;
  background:linear-gradient(135deg,#fff,#ffe9f3); border:2px solid var(--pink-deep); border-radius:18px 22px 18px 24px/22px 18px 24px 18px;
  box-shadow:0 10px 26px rgba(255,126,182,.35); padding:12px 16px; display:none; align-items:center; gap:10px; font-size:14px; color:var(--ink);}
#banner.show{display:flex; animation:slideDown .3s ease;}
@keyframes slideDown{from{opacity:0; transform:translateY(-16px);} to{opacity:1; transform:none;}}
#banner .b-close{margin-left:auto; font-size:18px; color:var(--pink-deep);}
/* ---------- Toast ---------- */
#toast{position:fixed; left:50%; bottom:110px; transform:translateX(-50%) translateY(20px); z-index:70;
  background:rgba(91,58,82,.92); color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none; transition:.25s; max-width:86vw; text-align:center;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
/* ---------- 弹窗 ---------- */
#mask{position:fixed; inset:0; z-index:50; background:rgba(91,58,82,.35); backdrop-filter:blur(2px); display:none; align-items:flex-end; justify-content:center;}
#mask.show{display:flex;}
#sheet{width:100%; max-width:620px; max-height:88vh; overflow-y:auto; background:linear-gradient(180deg,#fff,#fff3f8);
  border-radius:28px 28px 0 0; padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 20px);
  border-top:3px solid var(--pink); box-shadow:0 -10px 40px rgba(255,126,182,.3); animation:up .25s ease;}
@keyframes up{from{transform:translateY(40px);} to{transform:none;}}
#sheet h3{margin:0 0 14px; font-size:17px; color:var(--pink-deep); display:flex; align-items:center; gap:8px;}
#sheet .closeX{margin-left:auto; width:30px; height:30px; border-radius:50%; background:var(--pink-soft); color:var(--pink-deep); font-size:16px; display:flex; align-items:center; justify-content:center;}
/* ---------- 列表项 ---------- */
.item{display:flex; align-items:flex-start; gap:10px; padding:10px 12px; margin-bottom:8px; background:rgba(255,255,255,.75);
  border:1.5px solid rgba(255,201,223,.8); border-radius:16px 20px 16px 22px/20px 16px 22px 16px;}
.item .main{flex:1; min-width:0;}
.item .t{font-size:14px; font-weight:700; color:var(--ink); word-break:break-all; line-height:1.45;}
.item .s{font-size:11px; color:var(--ink-soft); margin-top:2px; line-height:1.45;}
.item .ops{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.chip{display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; background:var(--pink-soft); color:var(--pink-deep); border:1.5px solid var(--line);}
.chip.mint{background:#eafaf2; color:#2fa87e; border-color:#b8f0d8;}
.chip.lav{background:#f3edff; color:#8a63d2; border-color:#cdb4f6;}
.chip.lemon{background:#fff9e0; color:#c08a00; border-color:#fff3b0;}
.chip.peach{background:#fff0e6; color:#d97a3c; border-color:#ffd9c0;}
.chip.sky{background:#e9f6ff; color:#3a8fc9; border-color:#bde3ff;}
.chip.gray{background:#f2eef1; color:#9b8393; border-color:#e3d4dc;}
/* ---------- 小花勾选框 ---------- */
.flower{width:26px; height:26px; flex:0 0 26px; border-radius:50%; border:2px solid var(--pink-deep); position:relative; background:#fff; transition:.15s;}
.flower::before{content:"🌸"; position:absolute; inset:-1px; display:flex; align-items:center; justify-content:center; font-size:14px; opacity:0; transform:scale(.4); transition:.15s;}
.flower.on{background:linear-gradient(135deg,#fff,#ffe6f0);}
.flower.on::before{opacity:1; transform:scale(1);}
/* ---------- 进度条糖果条纹 ---------- */
.candy{height:16px; border-radius:999px; background:#ffe4ef; overflow:hidden; border:1.5px solid var(--line); position:relative;}
.candy .fill{height:100%; border-radius:999px; background:repeating-linear-gradient(45deg,#ff9ecb 0 12px,#ffc1dd 12px 24px); transition:width .3s ease;}
/* ---------- 分段切换 ---------- */
.seg{display:flex; gap:6px; background:rgba(255,255,255,.6); border:1.5px solid var(--line); border-radius:999px; padding:4px; margin-bottom:12px;}
.seg .sbtn{flex:1; padding:8px 4px; border-radius:999px; font-size:13px; font-weight:700; color:var(--ink-soft); text-align:center;}
.seg .sbtn.on{background:linear-gradient(180deg,#ff9ecb,#ff7eb6); color:#fff; box-shadow:0 3px 8px rgba(255,126,182,.3);}
/* ---------- 迷你图表 ---------- */
.chart-wrap{background:rgba(255,255,255,.7); border:1.5px solid rgba(255,201,223,.8); border-radius:16px 20px 16px 22px/20px 16px 22px 16px; padding:10px; margin-bottom:10px;}
.chart-wrap canvas{display:block; width:100%; height:180px;}
.legend{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; font-size:11px; color:var(--ink-soft);}
.legend .lg{display:inline-flex; align-items:center; gap:4px;}
.legend .dot{width:10px; height:10px; border-radius:3px; display:inline-block;}
/* ---------- 日历 ---------- */
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.cal-head .mn{font-size:15px; font-weight:700; color:var(--ink);}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center;}
.cal-grid .wd{font-size:11px; color:var(--ink-faint); padding:4px 0;}
.cal-grid .d{position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:13px; border-radius:14px; color:var(--ink);}
.cal-grid .d.dim{color:#dcc6d2;}
.cal-grid .d.sel{background:linear-gradient(135deg,#ff9ecb,#ff7eb6); color:#fff; font-weight:700;}
.cal-grid .d.today{background:#ffe6f0; color:var(--pink-deep); font-weight:700; border-radius:50% 50% 45% 55%/50% 55% 45% 50%; box-shadow:inset 0 0 0 2px var(--pink-deep);}
.cal-grid .d.today::after{content:"♥"; position:absolute; top:-3px; right:-3px; font-size:9px; color:var(--pink-deep);}
.cal-grid .d .dot{position:absolute; bottom:4px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--pink-deep);}
/* ---------- 空状态 ---------- */
.empty{text-align:center; padding:26px 10px; color:var(--ink-soft);}
.empty svg{width:110px; height:auto; margin-bottom:6px;}
.empty .et{font-size:13px; font-weight:700; color:var(--ink-soft);}
.empty .es{font-size:11px; color:var(--ink-faint); margin-top:3px;}
/* ---------- 统计卡 ---------- */
.stats{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.stat{background:linear-gradient(135deg,rgba(255,255,255,.85),rgba(255,233,243,.85)); border:2px solid var(--line); border-radius:20px 24px 18px 26px/24px 18px 26px 20px; padding:12px; position:relative; overflow:hidden;}
.stat .sl{font-size:11px; color:var(--ink-soft);}
.stat .sv{font-size:22px; font-weight:700; color:var(--pink-deep); margin-top:2px; word-break:break-all;}
.stat .sico{position:absolute; right:8px; bottom:6px; font-size:26px; opacity:.35;}
.stat.alt .sv{color:#8a63d2;} .stat.mint .sv{color:#2fa87e;} .stat.lemon .sv{color:#c08a00;} .stat.peach .sv{color:#d97a3c;}
/* ---------- 快捷入口 ---------- */
.quick{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
.quick .q{display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 4px; border-radius:20px 24px 18px 26px/24px 18px 26px 20px;
  background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,233,243,.9)); border:2px solid var(--line); box-shadow:var(--shadow); font-size:12px; font-weight:700; color:var(--ink); transition:.12s;}
.quick .q:active{transform:scale(.95);}
.quick .q .qi{font-size:26px;}
/* ---------- 首页大进度 ---------- */
.big-ring{display:flex; align-items:center; gap:14px;}
.big-ring .pct{font-size:30px; font-weight:700; color:var(--pink-deep);}
/* ---------- 草稿预览 ---------- */
.preview-title{font-size:19px; font-weight:700; color:var(--ink); line-height:1.5; margin-bottom:10px; text-align:center;}
.preview-body{font-size:14px; line-height:1.9; color:var(--ink); white-space:pre-wrap; word-break:break-word;}
.divider{height:2px; background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 18px); margin:14px 0;}
/* 通用 */
.mt8{margin-top:8px;} .mt12{margin-top:12px;} .center{text-align:center;} .muted{color:var(--ink-soft); font-size:12px;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
hr.sep{border:none; border-top:2px dashed var(--line); margin:12px 0;}
.done-text{text-decoration:line-through; color:var(--ink-faint);}
.toggle{width:50px; height:28px; border-radius:999px; background:#e9dce3; position:relative; transition:.2s; flex:0 0 50px;}
.toggle::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.2); transition:.2s;}
.toggle.on{background:linear-gradient(90deg,#ff9ecb,#ff7eb6);}
.toggle.on::after{left:25px;}
.setrow{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1.5px dashed var(--line);}
.setrow:last-child{border-bottom:none;}
.setrow .sl{flex:1;}
.setrow .sl .t{font-size:14px; font-weight:700;}
.setrow .sl .s{font-size:11px; color:var(--ink-faint); margin-top:2px;}
.tag-days{display:flex; gap:5px; flex-wrap:wrap;}
.tag-days .dbtn{width:32px; height:32px; border-radius:50%; border:1.5px solid var(--line); font-size:11px; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; background:#fff;}
.tag-days .dbtn.on{background:linear-gradient(135deg,#ff9ecb,#ff7eb6); color:#fff; border-color:transparent; font-weight:700;}
.emoji-row{display:grid; grid-template-columns:repeat(6,1fr); gap:8px;}
.emoji-row .e{aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:30px; border-radius:22px; background:rgba(255,255,255,.8); border:2px solid var(--line); transition:.12s;}
.emoji-row .e.on{background:linear-gradient(135deg,#ffe0ee,#ffc1dd); box-shadow:0 0 0 3px rgba(255,126,182,.2); transform:scale(1.08); border-color:var(--pink-deep);}
</style>
</head>
<body>
<div id="bg" aria-hidden="true">
  <div class="deco cloud" style="width:120px;height:40px;top:9%;left:-18px;"></div>
  <div class="deco cloud" style="width:90px;height:30px;top:16%;right:-12px;"></div>
  <div class="deco" style="top:4%;right:16%;font-size:26px;">⭐</div>
  <div class="deco" style="top:22%;left:10%;font-size:18px;">💖</div>
  <div class="deco" style="top:38%;right:8%;font-size:20px;">🌸</div>
  <div class="deco" style="top:55%;left:5%;font-size:22px;">☁️</div>
  <div class="deco" style="top:70%;right:12%;font-size:18px;">💕</div>
  <div class="deco" style="top:84%;left:14%;font-size:20px;">🌷</div>
  <svg id="grass" viewBox="0 0 1200 90" preserveAspectRatio="none"><path class="gwave" d="M0 60 C150 20 300 80 450 50 C600 20 750 80 900 55 C1050 30 1150 60 1200 45 L1200 90 L0 90 Z" fill="#cdebd6"/><path class="gwave" d="M0 72 C200 40 400 90 600 60 C800 30 1000 80 1200 55 L1200 90 L0 90 Z" fill="#a9ddbe" opacity=".7"/></svg>
</div>

<header id="topbar">
  <div class="brand"><span class="bow">🎀</span> 我的小小生活</div>
  <div class="clock" id="clock"></div>
</header>

<div id="page">
  <div id="fallback" style="margin:70px 22px;text-align:center;color:#5b3a52;font-size:15px;line-height:2.1;background:rgba(255,255,255,.75);border:2px solid #ffc9df;border-radius:22px;padding:24px 16px;">
    <div style="font-size:44px">🎀</div>
    <b>页面正在加载…</b><br>
    如果一直停留在这个提示，说明当前是在「预览模式」里，网页脚本没有被运行。<br>
    请改用浏览器打开这个文件（Safari / Chrome / Edge）。
  </div>
  <section class="page" data-page="home"></section>
  <section class="page" data-page="plan"></section>
  <section class="page" data-page="create"></section>
  <section class="page" data-page="gzh"></section>
  <section class="page" data-page="hot"></section>
  <section class="page" data-page="diet"></section>
  <section class="page" data-page="money"></section>
  <section class="page" data-page="mood"></section>
  <section class="page" data-page="review"></section>
  <section class="page" data-page="settings"></section>

function pad(n){ return (n<10?"0":"")+n; }
function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function nowHM(){ var d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function fmtMoney(n){ n=Number(n)||0; return (n<0?"-":"")+"¥"+Math.abs(n).toFixed(2); }
function fmtShortMoney(n){ n=Number(n)||0; var a=Math.abs(n); if(a>=10000) return (n<0?"-":"")+"¥"+(a/10000).toFixed(1)+"w"; return fmtMoney(n); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function wkOfYear(){ var d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+3-((d.getDay()+6)%7)); var w1=new Date(d.getFullYear(),0,4); return 1+Math.round(((d-w1)/86400000-3+((w1.getDay()+6)%7))/7); }

    version:1,
    plan:{ tasks:{}, schedule:[], reminded:{} },
    create:{ platform:"xiaohongshu", topics:[], scripts:[], schedule:[] },
    gzh:{ drafts:[] },

    settings:{ appId:"", appSecret:"", genTime:"09:00", voice:"sweet", waterReminder:false, waterInterval:45, notif:false },
    meta:{ lastGen:"" }
  };
}
var DB = load();
function load(){
  try{ var s=localStorage.getItem(LS_KEY); if(s){ var o=JSON.parse(s); return deepMerge(defaultDB(),o); } }catch(e){}
  return defaultDB();
}
function deepMerge(base,o){
  if(Array.isArray(o)) return o;
  if(o&&typeof o==="object"){
    var out={}; for(var k in base){ out[k]=base[k]; }
    for(var k in o){ out[k]=(base[k]&&typeof base[k]==="object"&&!Array.isArray(base[k]))?deepMerge(base[k],o[k]):o[k]; }
    return out;
  }
  return o;
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){ toast("保存失败：存储已满"); } }

/* ================= Toast / 弹窗 / 横幅 ================= */
var toastTimer=null;

/* ================= 通知 ================= */
function askNotif(){
  if(!("Notification" in window)){ toast("此浏览器不支持系统通知"); return; }
  var doneCalled = false;
  function done(p){ if(doneCalled) return; doneCalled = true; DB.settings.notif = (p==="granted"); save(); toast(p==="granted"?"已开启系统通知":"未授权通知"); }
  try{
    var r = Notification.requestPermission(done);
    if(r && typeof r.then === "function"){ r.then(done); }
  }catch(e){ toast("通知授权失败"); }
}
function fireNotif(title, body){
  if("Notification" in window && Notification.permission==="granted"){
    try{ new Notification(title, {body:body||"", icon:undefined}); }catch(e){}
  }
  showBanner((title||"")+(body?" · "+body:""));
}

    +'<button class="q" onclick="go(\'mood\')"><span class="qi">🌷</span>心情</button>'

];

/* ================= 1. 今日计划 ================= */
var planView = { y:new Date().getFullYear(), m:new Date().getMonth(), date:todayStr() };
function renderPlan(){
  var t = planView.date;
  var tasks = (DB.plan.tasks[t]||[]).slice().sort(function(a,b){ return (a.time||"99:99").localeCompare(b.time||"99:99"); });
  var fixed = DB.plan.schedule.slice().sort(function(a,b){ return (a.time||"").localeCompare(b.time||""); });
  var html = '';
  html += '<div class="card"><h2 class="ctitle"><span class="ico">🗓️</span>日历视图</h2>'+calHTML()+'</div>';

  html += '<div class="card"><h2 class="ctitle"><span class="ico">⏰</span>固定行程 <span class="chip lav">'+fixed.length+'项</span>'

  }else{
    html += fixed.map(function(f,i){
      var days = (f.days||[]).map(function(d){return "一二三四五六日"[d];}).join("·")||"每天";
      return '<div class="item"><div class="main"><div class="t">'+esc(f.time||"")+' '+esc(f.title)+'</div><div class="s">'+esc(f.note||"")+' · 每周：'+esc(days)+'</div></div>'
        +'<div class="ops"><button class="chip" onclick="editFixed('+i+')">改</button><button class="chip gray" onclick="delFixed('+i+')">删</button></div></div>';
    }).join("");
  }
  html += '</div>';

  html += '<div class="card"><h2 class="ctitle"><span class="ico">🔔</span>提醒事项 · '+esc(t.slice(5))+''
    +'<button class="btn mini" style="margin-left:auto" onclick="addTask()">＋提醒</button></h2>';
  if(tasks.length===0){
    html += '<div class="empty">'+emptySVG("⏰")+'<div class="et">今天还没有提醒事项</div><div class="es">给重要的事设一个到点提醒吧</div></div>';
  }else{

function calHTML(){
  var y=planView.y, m=planView.m;
  var first = new Date(y,m,1).getDay();
  var daysIn = new Date(y,m+1,0).getDate();
  var today = todayStr();
  var html = '<div class="cal-head"><button class="btn mini ghost" onclick="calShift(-1)">‹</button>'
    +'<div class="mn">'+y+' 年 '+(m+1)+' 月</div>'
    +'<button class="btn mini ghost" onclick="calShift(1)">›</button></div>';
  html += '<div class="cal-grid">';
  ["日","一","二","三","四","五","六"].forEach(function(w){ html+='<div class="wd">'+w+'</div>'; });
  var prevDays = new Date(y,m,0).getDate();
  for(var i=0;i<first;i++){ html+='<div class="d dim">'+(prevDays-first+1+i)+'</div>'; }
  for(var d=1; d<=daysIn; d++){
    var ds = y+"-"+pad(m+1)+"-"+pad(d);
    var has = (DB.plan.tasks[ds]||[]).length>0;
    var cls = "d";
    if(ds===today) cls+=" today";
    if(ds===planView.date) cls+=" sel";
    html += '<div class="'+cls+'" onclick="pickPlanDate(\''+ds+'\')">'+d+(has?'<span class="dot"></span>':"")+'</div>';
  }
  html += '</div>';
  return html;
}
function calShift(k){ planView.m+=k; if(planView.m<0){planView.m=11;planView.y--;} if(planView.m>11){planView.m=0;planView.y++;} renderPage("plan"); }

function speakScript(id){
  var s = findById(DB.create.scripts,id); if(!s) return;
  if(!("speechSynthesis" in window)){ toast("此设备不支持语音播报"); return; }
  window.speechSynthesis.cancel();
  var text = "钩子。"+s.hook+" 主题。"+s.theme+" 正文。"+s.body+" 结尾。"+s.ending;
  var u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  var v = DB.settings.voice||"sweet";
  if(v==="sweet"){ u.pitch=1.4; u.rate=1.0; } else if(v==="soft"){ u.pitch=1.1; u.rate=0.9; } else if(v==="lively"){ u.pitch=1.6; u.rate=1.15; } else { u.pitch=1.2; u.rate=1.0; }
  var voices = window.speechSynthesis.getVoices();
  var zh = voices.filter(function(vv){ return /zh|cmn|CN/i.test(vv.lang); });
  if(zh.length) u.voice = zh[0];
  window.speechSynthesis.speak(u);
  toast("开始播报 🔊");
}

var HOT_SEED = [
  "年轻人开始反向消费","citywalk成为新社交方式","上班族爱上碎片化学习","多巴胺穿搭刷屏",
  "沉浸式收纳视频走红","打工人带饭挑战","县城咖啡店崛起","电子榨菜成吃饭标配",
  "00后整顿职场","一人食经济升温","情绪价值成消费关键词","夜校报名火爆",
  "公园20分钟效应","养生茶饮受追捧","迷你厨房玩具出圈","副业刚需时代",
  "AI工具改变工作流","国货美妆逆袭","低成本约会指南","gap day 风潮"
];
function hotList(){
  return HOT_SEED.slice().sort(function(){return Math.random()-0.5;}).map(function(h,i){
    var heat = Math.floor(Math.random()*900000)+80000;
    return {title:h, heat:heat, rank:i+1, tag:i<3?"爆":(i<8?"热":"新")};
  });
}
function renderHot(){
  var list = hotList();
  var html = '<div class="card"><h2 class="ctitle"><span class="ico">🔥</span>热搜榜'
    +'<button class="btn mini ghost" style="margin-left:auto" onclick="renderPage(\'hot\')">🔄 刷新</button></h2>'
    +'<div class="hint" style="margin-bottom:8px">离线示例榜单 · 联网时数据为本地模拟，仅用于选题灵感</div>';
  list.forEach(function(h){
    var tagHtml = h.tag==="爆" ? '<span class="chip peach">爆</span>' : (h.tag==="热" ? '<span class="chip">热</span>' : '<span class="chip sky">新</span>');
    html += '<div class="item"><div class="main"><div class="t"><span class="chip gray" style="margin-right:6px">'+h.rank+'</span> '+tagHtml+' <span>'+esc(h.title)+'</span></div>'
      +'<div class="s">🔥 '+Math.round(h.heat/10000)+' 万热度</div></div></div>';
  });
  html += '</div>';

  html += '<div class="card"><h2 class="ctitle"><span class="ico">💡</span>热点选题建议</h2>';
  var picks = list.slice(0,5);
  picks.forEach(function(h){
    var angle = "可以围绕「"+h.title+"」做一期：普通人视角的真实体验 + 3个实用建议，结尾引导互动。";
    html += '<div class="item"><div class="main"><div class="t">'+esc(h.title)+'</div><div class="s">'+esc(angle)+'</div></div>'
      +'<div class="ops"><button class="chip" onclick="useHotAsTopic(\''+esc(h.title)+'\')">＋存为选题</button></div></div>';
  });
  html += '</div>';
  return html;
}
function useHotAsTopic(t){
  DB.create.topics.push({id:uid(), text:t, platform:DB.create.platform, status:0, createdAt:Date.now()});
  save(); toast("已存入选题库 ✓");
}

function drawWeight(){
  var cv = $("#weightChart"); if(!cv) return;
  var weights = DB.diet.weight.slice().sort(function(a,b){return (a.date||"").localeCompare(b.date||"");}).slice(-14);
  if(weights.length<2) return;
  var vals = weights.map(function(w){return Number(w.value);});
  var min = Math.min.apply(null,vals)-0.5, max = Math.max.apply(null,vals)+0.5;
  var W = cv.clientWidth||300, H = cv.clientHeight||180;
  var dpr = window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+"px"; cv.style.height=H+"px";
  var ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  var pad=28, ph=H-pad*2, pw=W-pad*2;
  ctx.strokeStyle="#f3c6db"; ctx.lineWidth=1; ctx.setLineDash([4,4]);
  for(var g=0;g<=3;g++){ var gy=pad+ph/3*g; ctx.beginPath(); ctx.moveTo(pad,gy); ctx.lineTo(W-pad,gy); ctx.stroke(); }
  ctx.setLineDash([]);
  function y(v){ return pad + (max-v)/(max-min)*ph; }
  ctx.beginPath();
  weights.forEach(function(w,i){
    var x = pad + (weights.length===1?pw/2:pw/(weights.length-1)*i);
    var yy = y(Number(w.value));
    if(i===0) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
  });
  ctx.strokeStyle="#ff7eb6"; ctx.lineWidth=3; ctx.lineJoin="round"; ctx.stroke();
  ctx.fillStyle="rgba(255,126,182,.15)";
  ctx.lineTo(pad+pw/(weights.length-1)*(weights.length-1), pad+ph); ctx.lineTo(pad, pad+ph); ctx.closePath(); ctx.fill();
  weights.forEach(function(w,i){
    var x = pad + (weights.length===1?pw/2:pw/(weights.length-1)*i);
    var yy = y(Number(w.value));
    ctx.beginPath(); ctx.arc(x,yy,5,0,Math.PI*2); ctx.fillStyle="#fff"; ctx.fill(); ctx.strokeStyle="#ff7eb6"; ctx.lineWidth=2.5; ctx.stroke();
    if(weights.length<=8 || i%2===0){ ctx.fillStyle="#8a6a80"; ctx.font="10px sans-serif"; ctx.textAlign="center"; ctx.fillText(w.value, x, yy-9); }
  });
}

  expense:[["餐饮","🍜"],["交通","🚇"],["购物","🛍️"],["娱乐","🎮"],["居住","🏠"],["医疗","💊"],["学习","📚"],["其他","🧾"]],

var moneyTab = "list";

function moneyListHTML(){

function moneyPieHTML(){
  var thisMonth = todayStr().slice(0,7);
  var recs = DB.money.records.filter(function(r){return r.date&&r.date.slice(0,7)===thisMonth;});
  var expBy={}, incBy={};
  recs.forEach(function(r){ var map = r.type==="income"?incBy:expBy; map[r.category]=(map[r.category]||0)+Number(r.amount); });
  var html = '<div class="two-col">';
  html += pieBlock("支出占比","expense",expBy);
  html += pieBlock("收入占比","income",incBy);
  html += '</div><div class="hint">本月数据 · 按分类统计</div>';
  return html;
}
function pieBlock(title,type,map){
  var cats = MONEY_CATS[type];
  var data = cats.map(function(c,i){ return {label:c[0], value:map[c[0]]||0, color:CAT_COLORS[i%CAT_COLORS.length]}; }).filter(function(d){return d.value>0;});
  var total = data.reduce(function(s,d){return s+d.value;},0);
  var html = '<div class="chart-wrap"><div style="font-size:13px;font-weight:700;margin-bottom:6px">'+title+(total?(' 共'+fmtShortMoney(total)):"")+'</div>';
  if(!data.length){ html += '<div class="muted">暂无数据</div>'; }
  else{ html += '<canvas id="pie-'+type+'" style="height:150px"></canvas><div class="legend">'+data.map(function(d){return '<span class="lg"><span class="dot" style="background:'+d.color+'"></span>'+esc(d.label)+' '+Math.round(d.value/total*100)+'%</span>';}).join("")+'</div>'; }
  html += '</div>';
  return html;
}
function drawPie(cvId,type){
  var cv = document.getElementById(cvId); if(!cv) return;
  var thisMonth = todayStr().slice(0,7);
  var map={};
  DB.money.records.forEach(function(r){ if(r.date&&r.date.slice(0,7)===thisMonth&&r.type===type){ map[r.category]=(map[r.category]||0)+Number(r.amount); } });
  var data = MONEY_CATS[type].map(function(c,i){ return {label:c[0], value:map[c[0]]||0, color:CAT_COLORS[i%CAT_COLORS.length]}; }).filter(function(d){return d.value>0;});
  if(!data.length) return;
  var W=cv.clientWidth||150, H=cv.clientHeight||150;
  var dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+"px"; cv.style.height=H+"px";
  var ctx=cv.getContext("2d"); ctx.scale(dpr,dpr); ctx.clearRect(0,0,W,H);
  var cx=W/2, cy=H/2, r=Math.min(W,H)/2-4;
  var total=data.reduce(function(s,d){return s+d.value;},0)||1;
  var a=-Math.PI/2;
  data.forEach(function(d){
    var ang=d.value/total*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a,a+ang); ctx.closePath();
    ctx.fillStyle=d.color; ctx.fill(); ctx.strokeStyle="#fff"; ctx.lineWidth=2; ctx.stroke();
    a+=ang;
  });
  ctx.beginPath(); ctx.arc(cx,cy,r*0.55,0,Math.PI*2); ctx.fillStyle="#fff"; ctx.fill(); ctx.strokeStyle="#ffd6e8"; ctx.stroke();

function drawDualBar(cvId, labels, incVals, expVals){
  var cv=document.getElementById(cvId); if(!cv) return;
  var W=cv.clientWidth||300, H=cv.clientHeight||170;
  var dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+"px"; cv.style.height=H+"px";
  var ctx=cv.getContext("2d"); ctx.scale(dpr,dpr); ctx.clearRect(0,0,W,H);
  var max=Math.max.apply(null, incVals.concat(expVals).concat([1]))*1.15;
  var pad=30, ph=H-pad-20, pw=W-pad-6;
  var n=labels.length, bw=Math.min(26, pw/n*0.32);
  function x(i){ return pad + pw/(n)*i + pw/(n)*0.5; }
  labels.forEach(function(l,i){
    var xc=x(i);
    var ih=incVals[i]/max*ph, eh=expVals[i]/max*ph;
    ctx.fillStyle="#7ed8b0"; roundRect(ctx,xc-bw/2, pad+ph-ih, bw, ih, 4); ctx.fill();
    ctx.fillStyle="#ff9ecb"; roundRect(ctx,xc+bw/2, pad+ph-eh, bw, eh, 4); ctx.fill();
    ctx.fillStyle="#8a6a80"; ctx.font="10px sans-serif"; ctx.textAlign="center"; ctx.fillText(l, xc, pad+ph+14);
  });
  function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
}

function drawMoodPie(){

  var data = MOODS.map(function(m){ return {label:m[0]+" "+m[1], value:counts[m[0]]||0, color:m[2]}; }).filter(function(d){return d.value>0;});
  if(!data.length) return;
  var W=cv.clientWidth||150, H=cv.clientHeight||150;
  var dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+"px"; cv.style.height=H+"px";
  var ctx=cv.getContext("2d"); ctx.scale(dpr,dpr); ctx.clearRect(0,0,W,H);
  var cx=W/2, cy=H/2, r=Math.min(W,H)/2-4;
  var total=data.reduce(function(s,d){return s+d.value;},0)||1;

    ctx.fillStyle=d.color; ctx.fill(); ctx.strokeStyle="#fff"; ctx.lineWidth=2; ctx.stroke(); a+=ang;
  });

function goalBar(label, pct){

function reviewText(pub, balance, taskRate, moodRate){
  var parts = [];

  else parts.push("这个月还没有新发布，可以从一个最小选题开始");

  return parts.join("。")+"。继续温柔地前进吧 🎀";
}

function bindPage(p){
  if(p==="diet"){
    var w=$("#w-date"); if(w) w.value = todayStr();
  }
  if(p==="money" && moneyTab==="bar"){
    drawCharts("money");
  }
  if(p==="mood"){ moodEmoji=""; var today=DB.mood.entries[todayStr()]; if(today) moodEmoji=today.emoji; }
  drawCharts(p);
}

/* ================= 定时提醒循环 ================= */
var lastWaterTs = 0;
function reminderLoop(){
  var now = new Date();
  var hm = pad(now.getHours())+":"+pad(now.getMinutes());
  var t = todayStr();
  var tasks = DB.plan.tasks[t]||[];
  tasks.forEach(function(tk){
    if(tk.remind && tk.time && !tk.done){
      var key = t+"|"+tk.id;
      if(tk.time<=hm && !DB.plan.reminded[key]){
        DB.plan.reminded[key]=true; save();
        fireNotif("⏰ 提醒：", tk.text);
      }
    }
  });
  if(DB.settings.waterReminder){
    var iv = (DB.settings.waterInterval||45)*60*1000;
    if(Date.now()-lastWaterTs > iv){
      lastWaterTs = Date.now();
      fireNotif("💧 该喝水啦", "记得起来喝杯水，顺便活动一下");
    }
  }
  // 定时生成（每天一次）
  var gen = DB.settings.genTime||"09:00";
  var genKey = t+"|gen";
  if(hm>=gen && DB.meta.lastGen!==genKey){
    DB.meta.lastGen = genKey; save();
    if(DB.create.topics.length || true){ // 自动补充灵感
      var p = DB.create.platform;
      var bank = TOPIC_BANK[p];
      DB.create.topics.push({id:uid(), text:"今日灵感｜"+bank[Math.floor(Math.random()*bank.length)], platform:p, status:0, createdAt:Date.now()});
      DB.create.scripts.push({id:uid(), theme:"今日自动生成", hook:SCRIPT_HOOKS[Math.floor(Math.random()*SCRIPT_HOOKS.length)], body:SCRIPT_BODIES[0], ending:SCRIPT_ENDINGS[0], createdAt:Date.now()});
      save();
      toast("✨ 定时生成已完成");
    }
  }
  updateClock();
}
function updateClock(){
  var d = new Date();
  var wd = ["日","一","二","三","四","五","六"][d.getDay()];
  var txt = pad(d.getHours())+":"+pad(d.getMinutes());
  var el = $("#clock"); if(el) el.innerHTML = "<b>"+txt+"</b>周"+wd+" "+(d.getMonth()+1)+"/"+d.getDate();
}

/* ================= 启动 ================= */
function init(){
  var fb = document.getElementById("fallback"); if(fb){ fb.remove(); }
  if(typeof location !== "undefined" && location.protocol.indexOf("http") === 0 && "serviceWorker" in navigator){
    try{ navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){}
  }
  renderNav();
  go("home");
  updateClock();
  setInterval(updateClock, 15000);
  setInterval(reminderLoop, 15000);
  reminderLoop();
  if("speechSynthesis" in window){ window.speechSynthesis.getVoices(); }
}
document.addEventListener("DOMContentLoaded", init);
</script>
